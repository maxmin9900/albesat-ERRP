# Full local stack: Postgres + Redis + API + Celery + Web (all in Docker).
#
#   copy .env.docker.example .env
#   docker compose -f docker-compose.yml -f docker-compose.dockerdb.yml run --rm migrate
#   docker compose -f docker-compose.yml -f docker-compose.dockerdb.yml up -d --build
#
# URLs:
#   Web:    http://localhost:3050
#   API:    http://localhost:8010/docs  (DEBUG=true)
#   Health: http://localhost:8010/health

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: carpet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Rz@2026_Postgres!91}
      POSTGRES_DB: ${POSTGRES_DB:-carpet_db}
    ports:
      # Host 5432 is often taken on Windows (local Postgres). Map to 15432 on host.
      # Inside the compose network, services still use postgres:5432.
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: carpet-redis
    # No host port — avoids Windows Hyper-V reserved ports (6379, 6380, …).
    # API/Celery use redis://redis:6379 on the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./apps/api:/app
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DEBUG: ${DEBUG:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-mock}
      OTP_SEND_VIA_WHATSAPP: ${OTP_SEND_VIA_WHATSAPP:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-mock}
      OTP_SEND_VIA_WHATSAPP: ${OTP_SEND_VIA_WHATSAPP:-false}

  web:
    profiles: ["frontend"]
    platform: linux/amd64
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      API_INTERNAL_URL: http://api:8000
      WATCHPACK_POLLING: "true"

volumes:
  postgres_data:
  redis_data:
