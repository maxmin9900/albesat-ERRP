# Production reverse proxy — REQUIRED for camera/QR scanning on phones.
# Browsers only allow getUserMedia on HTTPS (or localhost).
#
# Setup (Ubuntu):
#   sudo apt install certbot python3-certbot-nginx
#   sudo cp infrastructure/nginx/carpet-pro.production.conf /etc/nginx/sites-available/carpet-pro
#   sudo ln -sf /etc/nginx/sites-available/carpet-pro /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d carpet-pro.ir -d www.carpet-pro.ir
#   sudo nginx -t && sudo systemctl reload nginx
#
# PM2 Next.js listens on 127.0.0.1:3050; API Docker on 127.0.0.1:8010.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

upstream carpet_web {
    server 127.0.0.1:3050;
    keepalive 32;
}

upstream carpet_api {
    server 127.0.0.1:8010;
    keepalive 16;
}

# Redirect all HTTP to HTTPS (camera will NOT work over plain HTTP except localhost).
server {
    listen 80;
    listen [::]:80;
    server_name carpet-pro.ir www.carpet-pro.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carpet-pro.ir www.carpet-pro.ir;

    # certbot fills these paths after: certbot --nginx -d carpet-pro.ir
    ssl_certificate     /etc/letsencrypt/live/carpet-pro.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carpet-pro.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://carpet_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/auth/otp/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://carpet_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://carpet_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
