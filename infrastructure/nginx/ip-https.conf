# Server access by IP only (no domain) — HTTPS with self-signed certificate.
# Live QR camera on phones needs https:// — http://IP will NOT open getUserMedia.
# Photo-scan fallback works on http://IP without this.
#
# One-time setup on Ubuntu server:
#   chmod +x infrastructure/scripts/setup-ip-https.sh
#   sudo SERVER_IP=YOUR.PUBLIC.IP infrastructure/scripts/setup-ip-https.sh
#   sudo cp infrastructure/nginx/ip-https.conf /etc/nginx/sites-available/carpet-ip
#   sudo sed -i "s/SERVER_IP/YOUR.PUBLIC.IP/g" /etc/nginx/sites-available/carpet-ip
#   sudo ln -sf /etc/nginx/sites-available/carpet-ip /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# On phone: open https://YOUR.PUBLIC.IP → Advanced → Proceed (accept warning once).
# PM2 Next.js: 127.0.0.1:3050 | API: 127.0.0.1:8010

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

upstream carpet_web {
    server 127.0.0.1:3050;
    keepalive 32;
}

upstream carpet_api {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_IP _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_IP _;

    ssl_certificate     /etc/nginx/ssl/carpet-ip.crt;
    ssl_certificate_key /etc/nginx/ssl/carpet-ip.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    add_header Permissions-Policy "camera=(self), microphone=()" always;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://carpet_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/auth/otp/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://carpet_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://carpet_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
